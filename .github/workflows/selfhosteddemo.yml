name: selfhosted demo workflow
on: push
jobs:
  selfhosted:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - run: npm ci
      - run: npm test
      -run: npm run build
