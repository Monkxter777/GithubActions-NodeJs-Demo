name: Build nodejs app
on: push
jobs:
    job_build:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout the code on runner
              uses: actions/checkout@v7
            - name: install nodejs
              uses: actions/setup-node@v7
              with:
                    node-version: '18'
            - name: install npm build dependies
              run: npm ci
            - name: exeute test cases
              run: npm test
            - name: build app
              run: npm run build
            - name: download the dist to github repo
              uses: actions/upload-artifact@v7
              with: 
                  name: buildfile
                  path: dist
